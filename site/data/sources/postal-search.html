		// Same storage format as AccessibilityService and track.ukrposhta.ua
		(function () {
			try {
				var state = JSON.parse(localStorage.getItem('up-accessibility'));
				if (!state) return;
				var root = document.documentElement;
				if (state.contrast === 'contrast') root.classList.add('is-contrast');
				if (state.contrast === 'dark') root.classList.add('is-dark');
				if (state.fontSize === 'md') root.classList.add('is-font-md');
				if (state.fontSize === 'lg') root.classList.add('is-font-lg');
			} catch (e) {}
		})();
